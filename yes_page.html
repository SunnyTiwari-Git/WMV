<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFB6C1">
    <title>You Said Yes! 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="yes_style.css">
</head>

<body>
    <!-- Falling hearts -->
    <div class="hearts-rain"></div>

    <div class="container">
        <div class="celebration-content">
            <h1 class="celebration-title">🎉 Yay! 🎉</h1>
            <h2 class="main-message">You said YES!</h2>

            <div class="character-celebration">
                <div class="dog-emoji happy-character">🐶</div>
                <!-- Floating hearts around the dog -->
                <div class="dog-heart dog-heart-1">💕</div>
                <div class="dog-heart dog-heart-2">💖</div>
                <div class="dog-heart dog-heart-3">💗</div>
                <div class="dog-heart dog-heart-4">💝</div>
                <div class="dog-heart dog-heart-5">💓</div>
            </div>

            <div class="love-message">
                <p class="message-line">I'm so happy! 💕</p>
                <p class="message-line">You've made me the happiest person! ✨</p>
                <p class="message-line special">I love you, Rizza! 💖</p>
            </div>

            <div class="sparkles">
                <span class="sparkle">✨</span>
                <span class="sparkle">💫</span>
                <span class="sparkle">⭐</span>
                <span class="sparkle">🌟</span>
                <span class="sparkle">✨</span>
            </div>
        </div>
    </div>

    <script src="yes_script.js"></script>
</body>

</html>
