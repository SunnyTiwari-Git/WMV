<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#080812">
  <title>Daily Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="tracker-page">

  <!-- aurora background -->
  <div class="aurora" aria-hidden="true">
    <div class="aurora-orb aurora-orb-1"></div>
    <div class="aurora-orb aurora-orb-2"></div>
    <div class="aurora-orb aurora-orb-3"></div>
    <div class="aurora-orb aurora-orb-4"></div>
  </div>

  <!-- cursor glow -->
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <!-- hearts-background kept for compatibility with tracker_script.js -->
  <div class="hearts-background" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;"></div>

  <!-- STICKY HEADER -->
  <header class="tracker-bar">
    <div class="tracker-bar-inner">
      <span class="tracker-logo">Daily Adventure</span>
      <a href="index.html" class="home-link">&#8592; Home</a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="tracker-main">

    <!-- Day badge -->
    <div class="day-pill">
      <div class="day-pill-inner">
        <span>Today is</span>
        <strong id="dayName">&#8230;</strong>
      </div>
      <span class="day-special-tag" id="daySpecial"></span>
    </div>

    <!-- Activity Card -->
    <div class="act-card" id="activityCard">

      <div class="act-emoji-ring">
        <span class="act-emoji" id="activityEmoji"></span>
      </div>

      <h2 class="act-title" id="activityTitle">Loading&#8230;</h2>
      <p class="act-desc"  id="activityDescription"></p>

      <!-- Meta chips -->
      <div class="act-chips">
        <span class="chip" id="activityTime"></span>
        <span class="chip" id="activityDifficulty"></span>
      </div>

      <!-- Materials -->
      <div class="act-materials">
        <p class="act-materials-label">You will need</p>
        <ul id="materialsList"></ul>
      </div>

      <!-- Tips -->
      <div class="act-tips">
        <span class="act-tips-icon">Tip</span>
        <p id="tipsText"></p>
      </div>

      <!-- Action buttons -->
      <div class="act-actions">
        <button class="btn-complete" id="completeBtn">Complete</button>
        <button class="btn-skip"    id="skipBtn">Next Idea</button>
      </div>

    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="t-stat">
        <img src="https://picsum.photos/seed/streak/60/60" alt="" class="t-stat-img" aria-hidden="true">
        <span class="t-stat-num"   id="streakValue">0 days</span>
        <span class="t-stat-label">Current Streak</span>
      </div>
      <div class="t-stat">
        <img src="https://picsum.photos/seed/done/60/60" alt="" class="t-stat-img" aria-hidden="true">
        <span class="t-stat-num"   id="completedValue">0 activities</span>
        <span class="t-stat-label">Completed</span>
      </div>
    </div>

    <!-- History -->
    <div class="hist-btn-wrap">
      <button class="btn btn-ghost" id="historyBtn">View History</button>
    </div>

  </main>

  <!-- CELEBRATION OVERLAY -->
  <div class="celebration-overlay" id="celebrationOverlay">
    <div class="cel-box">
      <div class="cel-img-wrap">
        <img src="https://picsum.photos/seed/celebrate/200/200" alt="Celebration" class="cel-img">
      </div>
      <h2 class="cel-title">Amazing!</h2>
      <p class="cel-msg">You completed today's activity.<br>Your bond gets stronger every day.</p>
      <button class="btn btn-pink btn-sm" onclick="document.getElementById('celebrationOverlay').classList.remove('show')">
        Wonderful!
      </button>
    </div>
  </div>

  <!-- HISTORY MODAL (bottom sheet) -->
  <div class="history-modal" id="historyModal">
    <div class="hist-sheet">
      <div class="hist-handle"></div>
      <div class="hist-header">
        <h3 class="hist-title">Activity History</h3>
        <button class="close-btn" id="closeModal" aria-label="Close">&#215;</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="activities.js"></script>
  <script src="tracker_script.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    /* cursor glow */
    const glow = document.getElementById('cursorGlow');
    if (glow && !window.matchMedia('(pointer:coarse)').matches) {
      let frame;
      document.addEventListener('mousemove', e => {
        if (frame) cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          glow.style.transform = `translate3d(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%), 0)`;
        });
      });
    }
    /* magnetic complete button */
    const btn = document.getElementById('completeBtn');
    if (btn && !window.matchMedia('(pointer:coarse)').matches) {
      btn.addEventListener('mousemove', e => {
        const r = btn.getBoundingClientRect();
        btn.style.transform = `translate(${(e.clientX-r.left-r.width/2)*.22}px,${(e.clientY-r.top-r.height/2)*.22}px) scale(1.04)`;
      });
      btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
    }
  });
  </script>

</body>
</html>
